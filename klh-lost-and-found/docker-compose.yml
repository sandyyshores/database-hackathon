services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: klh_admin
      POSTGRES_PASSWORD: klh_secure_password
      POSTGRES_DB: klh_lost_found
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres_schema_pgvector.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  catalog-matching-fastapi:
    build: ./services/catalog-matching-fastapi
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      EXPRESS_SERVICE_URL: http://claims-express-service:8002
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - mongodb
      - kafka

  claims-express-service:
    build: ./services/claims-express-service
    environment:
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      - kafka

  verification-springboot-service:
    build: ./services/verification-springboot-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8003:8003"
    depends_on:
      - kafka

  frontend:
    build: ./frontend
    environment:
      FASTAPI_UPSTREAM: http://catalog-matching-fastapi:8001
      EXPRESS_UPSTREAM: http://claims-express-service:8002
    ports:
      - "5173:5173"
    depends_on:
      - catalog-matching-fastapi
      - claims-express-service
